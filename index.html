<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spiltag | Sistema de Aplicação de Master</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #263343; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); background: white; border-radius: 18px; padding: 38px 30px; text-align: center; box-shadow: 0 12px 38px #1c273414; }
    h1 { font-size: 25px; line-height: 1.25; margin: 0 0 12px; }
    p { line-height: 1.6; color: #5b6571; }
    .status { display: inline-flex; gap: 9px; align-items: center; margin-top: 16px; border-radius: 99px; padding: 10px 15px; background: #eaf8ee; color: #166534; font-weight: 700; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
    small { display: block; margin-top: 25px; color: #788390; }
  </style>
</head>
<body>
  <main>
    <h1>Sistema de Aplicação de Master</h1>
    <p>SPILTAG</p>
    <div class="status"><span class="dot"></span> Interface GitHub Pages ativa</div>
    <p>Ambiente inicial de testes. Login e integração com o banco de dados ainda não estão habilitados.</p>
    <small>Etapa 1.10 • Teste de publicação</small>
  </main>
</body>
</html>
